<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend</title>
  <style>
    /* General body styling with gradient background animation */
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(120deg, #89f7fe, #66a6ff);
      background-size: 200% 200%;
      animation: gradientShift 10s ease infinite;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      transition: all 0.3s ease;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Heading styling with animation */
    h1 {
      color: #007bff;
      font-size: 3rem;
      margin-bottom: 30px;
      animation: fadeInDown 1s ease forwards;
      opacity: 0;
    }

    @keyframes fadeInDown {
      0% { opacity: 0; transform: translateY(-50px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Button styling with hover animation */
    button {
      background-color: #00ffe1;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    button:hover {
      background-color: #b34500;
      transform: scale(1.1) rotate(-2deg);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* Output paragraph styling with fade-in animation */
    #output {
      font-size: 1.5rem;
      color: #444;
      background-color: rgba(255,255,255,0.8);
      padding: 20px 30px;
      border-radius: 12px;
      min-width: 300px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.8s ease, transform 0.5s ease;
    }

    #output.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      button { font-size: 1rem; padding: 12px 20px; }
      #output { font-size: 1.2rem; padding: 15px 20px; }
    }
  </style>
</head>
<body>
  <h1>Frontend Page</h1>
  <button onclick="loadMessage()">Get Backend Message</button>
  <p id="output"></p>

  <script>
    function loadMessage() {
      const output = document.getElementById("output");
      fetch("http://localhost:5000/api/message")
        .then(res => res.json())
        .then(data => {
          output.innerText = data.message;
          output.classList.add("show");
        })
        .catch(err => {
          output.innerText = "Error fetching message";
          output.classList.add("show");
          console.error(err);
        });
    }
  </script>
</body>
</html>
